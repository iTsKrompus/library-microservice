server:
  port: 8083

spring:
  application:
    name: loan-service
  datasource:
    url: jdbc:h2:mem:loandb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      # Permite conexiones desde fuera del contenedor de Docker
      settings:
        web-allow-others: true
services:
  book-service:
    url: http://localhost:8081
  user-service:
    url: http://localhost:8082
