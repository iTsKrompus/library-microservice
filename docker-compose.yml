version: '3.8'

services:
  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    container_name: book-service
    ports:
      - "8081:8081"
    networks:
      - library-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    networks:
      - library-network

  loan-service:
    build:
      context: .
      dockerfile: loan-service/Dockerfile
    container_name: loan-service
    ports:
      - "8083:8083"
    environment:
      # 🛠️ CORRECCIÓN: Nomenclatura exacta compatible con @Value("${services.book-service.url}")
      - SERVICES_BOOK_SERVICE_URL=http://book-service:8081
      - SERVICES_USER_SERVICE_URL=http://user-service:8082
    depends_on:
      - book-service
      - user-service
    networks:
      - library-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - book-service
      - user-service
      - loan-service
    networks:
      - library-network

networks:
  library-network:
    driver: bridge